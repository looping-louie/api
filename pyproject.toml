[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'looping-louie-api'
version = '0.8.1'
description = 'REST API for the Looping Louie development workflow.'
requires-python = '>=3.12'
dependencies = [
    'aiosqlite==0.22.*',
    'cryptography==44.0.*',
    'fastapi==0.138.*',
    'httpx==0.28.*',
    'python-dotenv==1.*',
    'uvicorn==0.49.*',
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
